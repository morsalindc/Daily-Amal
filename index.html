<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="আমলের গাইড">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>আমলের গাইড</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2b25;--mute:#66736d;--pri:#0f6b4f;--pri2:#e3f1ea;--line:#e4e0d4;--warn:#fff4d6;--warnink:#6b4e00}
@media (prefers-color-scheme:dark){:root{--bg:#10171a;--card:#18232a;--ink:#e8efe9;--mute:#98a8a0;--pri:#3fb68b;--pri2:#16352b;--line:#2a3a40;--warn:#3a3213;--warnink:#f1dd9a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Kalpurush","SolaimanLipi","Vrinda","Nirmala UI",system-ui,sans-serif;line-height:1.65;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;font-weight:700}
header small{opacity:.85;font-size:12px}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 2px 6px;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:0}
nav button span{font-size:20px;line-height:1.2}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card h2,.card h3{margin:0 0 6px;font-size:16px}
.banner{background:var(--warn);color:var(--warnink);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{flex:1;cursor:pointer}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--pri);flex:none}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:56px;resize:vertical}
.sm{width:90px;flex:none}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar button,.btn{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-size:15px}
.btn.alt{background:var(--pri2);color:var(--pri)}
.datebar .mid{text-align:center;flex:1}
.datebar .mid b{display:block;font-size:16px}
.datebar .mid small{color:var(--mute)}
.bar{height:10px;background:var(--pri2);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}
.mute{color:var(--mute);font-size:13px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 14px}
summary{padding:12px 0;font-weight:700;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";float:right;color:var(--pri)}
details[open] summary::after{content:"－"}
details .in{padding-bottom:12px;font-size:15px}
details h4{margin:12px 0 4px;color:var(--pri);font-size:15px}
details ul{margin:4px 0;padding-left:20px}
table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
th,td{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
th{background:var(--pri2)}
.note{background:var(--pri2);border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.ar{font-size:20px;text-align:center;direction:rtl;margin:10px 0;color:var(--pri)}
.mrow{padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .t{font-weight:600;font-size:15px;margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:14px}
.chips label{display:flex;align-items:center;gap:6px}
.auto{background:var(--pri2);color:var(--pri);border-radius:8px;padding:6px 10px;font-weight:700}
</style>
</head>
<body>
<header><h1>আমলের গাইড</h1><small id="ver"></small></header>
<main id="app"></main>
<nav id="nav">
  <button data-v="today"><span>✅</span>আজ</button>
  <button data-v="guide"><span>📖</span>গাইড</button>
  <button data-v="month"><span>📅</span>মাসিক</button>
  <button data-v="more"><span>⚙️</span>আরও</button>
</nav>
<script>
const VERSION='1.0.0';
document.getElementById('ver').textContent='সংস্করণ '+VERSION;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const GM=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const HM=['মুহাররম','সফর','রবিউল আউয়াল','রবিউস সানি','জমাদিউল আউয়াল','জমাদিউস সানি','রজব','শা\u2019বান','রমজান','শাওয়াল','জিলকদ','জিলহজ'];

const DEF={days:{},months:{},settings:{offset:-1}};
function load(){try{const o=JSON.parse(localStorage.getItem('amal.v1')||'{}');return {days:o.days||{},months:o.months||{},settings:Object.assign({offset:-1},o.settings||{})}}catch(e){return JSON.parse(JSON.stringify(DEF))}}
let S=load();
function save(){try{localStorage.setItem('amal.v1',JSON.stringify(S))}catch(e){}}
function day(k){return S.days[k]||(S.days[k]={c:{},jamaat:0,quran:'',n1:'',n2:'',n3:''})}

/* ---------- daily checklist ---------- */
const ITEMS=[
 ['f1','পাঁচ ওয়াক্ত ফরজ সালাত সময়মতো আদায় করেছি'],
 ['J','জামাতে আদায় করেছি (কয় ওয়াক্ত)'],
 ['f2','সুন্নত ও নফল সালাত আদায় করেছি'],
 ['f3','তাহাজ্জুদ / বিতর আদায় করেছি'],
 ['f4','কুরআন তিলাওয়াত করেছি','Q'],
 ['f5','কুরআনের অর্থ বা তাফসির পড়েছি'],
 ['f6','সকাল ও সন্ধ্যার যিকির করেছি'],
 ['f7','ফরজ সালাতের পরের যিকির করেছি'],
 ['f8','ইস্তিগফার ও দরূদ পড়েছি'],
 ['f9','পিতা-মাতা ও পরিবারের সাথে ভালো ব্যবহার করেছি'],
 ['f10','কাজে সততা ও আমানতদারি রক্ষা করেছি'],
 ['f11','হালাল উপার্জন ও ব্যয় করেছি; কিছু দান করেছি'],
 ['f12','মিথ্যা, গিবত, রাগ ও অপচয় থেকে বেঁচেছি'],
 ['f13','কাউকে কষ্ট দিয়ে থাকলে ক্ষমা চেয়েছি'],
 ['f14','ঘুমের আগে ওযু, দোয়া ও তাওবা করেছি']
];
const CHECKS=ITEMS.filter(i=>i[0]!=='J').map(i=>i[0]);

function hijri(date){
  try{
    const d=new Date(date.getTime()+S.settings.offset*864e5);
    const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(d);
    const g=t=>parseInt(p.find(x=>x.type===t).value,10);
    const r={d:g('day'),m:g('month'),y:g('year')};
    return (r.d&&r.m)?r:null;
  }catch(e){return null}
}
const WEEKLY={
 0:'পরিবারকে নিয়ে দ্বীনি আলোচনা বা একসাথে কুরআন পাঠ; সপ্তাহের পর্যালোচনা।',
 1:'সুন্নত নফল রোজা রাখুন; পরিবারের সবার খোঁজখবর নিন; সপ্তাহের কাজের নিয়ত ঠিক করুন।',
 2:'সাদাকা করুন (সামর্থ্য অনুযায়ী); কুরআনের তাফসির অধ্যয়নে সময় দিন।',
 3:'আত্মীয়-স্বজনের সাথে যোগাযোগ (সিলায়ে রেহমি); দোয়া ও ইস্তিগফারে সময় বাড়ান।',
 4:'সুন্নত নফল রোজা; সপ্তাহের আমলের হিসাব; কবর জিয়ারত ও মৃতদের জন্য দোয়া।',
 5:'জুমার দিন: গোসল, পরিষ্কার পোশাক, আগে মসজিদে যাওয়া, সূরা কাহফ, বেশি দরূদ, আসরের পর দোয়া, সাদাকা।',
 6:'দ্বীনি ইলমের মজলিসে বসুন বা দ্বীনি বই পড়ুন; অসুস্থ বা অসহায়কে দেখতে যান।'
};
function specials(date){
  const out=[],wd=date.getDay(),h=hijri(date);
  out.push('📌 '+WD[wd]+': '+WEEKLY[wd]);
  if(h){
    const {d,m}=h;
    const noFast=(m===10&&d===1)||(m===12&&d>=10&&d<=13);
    if(noFast) out.push('🚫 আজ রোজা রাখা নিষিদ্ধ (ঈদ/তাশরীকের দিন)।');
    else if(d>=13&&d<=15) out.push('🌙 আইয়্যামে বীজের রোজার দিন (হিজরি '+bn(d)+' '+HM[m-1]+')। নিয়ত করে সাহরি খান।');
    if(m===1&&(d===9||d===10||d===11)) out.push('🤲 আশুরার রোজা রাখার সময় (৯ ও ১০, অথবা ১০ ও ১১ মুহাররম)।');
    if(m===3) out.push('📖 রবিউল আউয়াল: সিরাতুন্নবী ﷺ অধ্যয়ন করুন।');
    if(m===8) out.push('🌿 শা\u2019বান: নফল রোজা বাড়ানো ও রমজানের প্রস্তুতির মাস।');
    if(m===9&&d>=21) out.push('✨ রমজানের শেষ দশক: ই\u2019তিকাফ ও লাইলাতুল কদর অনুসন্ধান (বেজোড় রাত)।');
    else if(m===9) out.push('🌙 রমজান: সিয়াম, তারাবিহ, কুরআন খতম, বেশি দান, যাকাত ও সাদাকাতুল ফিতর।');
    if(m===10&&d>1) out.push('📆 শাওয়ালের ছয় রোজা রাখার সময়।');
    if(m===12&&d<=9) out.push('⭐ জিলহজের প্রথম ১০ দিন: বেশি বেশি যিকির-তাকবীর-তাহলিল।'+(d===9?' আজ আরাফার দিন (হাজি নন এমনদের জন্য রোজা)।':''));
  }
  if(wd===1||wd===4){ if(!out.some(x=>x.startsWith('🚫'))) out.push('🕊️ সোমবার/বৃহস্পতিবার: নফল রোজার সুন্নত দিন।'); }
  return out;
}

let view='today',cur=new Date(),mcur=new Date();
function setView(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();window.scrollTo(0,0)}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)});

function pct(k){const d=S.days[k];if(!d)return 0;return CHECKS.filter(c=>d.c[c]).length/CHECKS.length}
function streak(){let n=0,d=new Date();
  if(pct(dkey(d))<0.5) d.setDate(d.getDate()-1);
  while(pct(dkey(d))>=0.5){n++;d.setDate(d.getDate()-1);if(n>3650)break}
  return n}

function renderToday(){
  const k=dkey(cur),d=day(k),h=hijri(cur);
  const isToday=k===dkey(new Date());
  let html=`<div class="card"><div class="datebar">
   <button id="prev">‹</button>
   <div class="mid"><b>${bn(cur.getDate())} ${GM[cur.getMonth()]} ${bn(cur.getFullYear())}, ${WD[cur.getDay()]}</b>
   <small>${h?bn(h.d)+' '+HM[h.m-1]+' '+bn(h.y)+' হি. (আনুমানিক)':''}</small></div>
   <button id="next">›</button></div>
   ${isToday?'':'<div style="text-align:center;margin-top:8px"><button class="btn alt" id="tod">আজকে ফিরুন</button></div>'}</div>`;
  specials(cur).forEach(t=>html+=`<div class="banner">${esc(t)}</div>`);
  html+=`<div class="card"><div class="mute" id="pt"></div><div class="bar"><i id="pb"></i></div><div class="mute" id="st"></div>`;
  ITEMS.forEach(([id,label,x])=>{
    if(id==='J'){
      html+=`<div class="row"><label for="jm">${label}</label><select id="jm" class="sm">${[0,1,2,3,4,5].map(n=>`<option value="${n}"${d.jamaat===n?' selected':''}>${bn(n)} / ${bn(5)}</option>`).join('')}</select></div>`;
    }else{
      html+=`<div class="row"><input type="checkbox" id="${id}" data-c="${id}"${d.c[id]?' checked':''}><label for="${id}">${label}</label></div>`;
      if(x==='Q') html+=`<div class="row" style="padding-top:0"><input type="text" id="qa" placeholder="পরিমাণ (যেমন: ২ পৃষ্ঠা / ১ রুকু / ১ পারা)" value="${esc(d.quran)}"></div>`;
    }
  });
  html+=`</div><div class="card"><h3>আজকের ভাবনা</h3>
   <div class="mute">আজ যে ভালো কাজ করতে পেরেছি</div><textarea data-n="n1">${esc(d.n1)}</textarea>
   <div class="mute" style="margin-top:8px">যে ভুল বা অবহেলা হয়েছে</div><textarea data-n="n2">${esc(d.n2)}</textarea>
   <div class="mute" style="margin-top:8px">আগামীকাল যে বিষয়ে উন্নতি করব</div><textarea data-n="n3">${esc(d.n3)}</textarea></div>`;
  $('#app').innerHTML=html;
  const shift=n=>{cur.setDate(cur.getDate()+n);render()};
  $('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
  if($('#tod'))$('#tod').onclick=()=>{cur=new Date();render()};
  $('#jm').onchange=e=>{d.jamaat=+e.target.value;save()};
  $('#qa').oninput=e=>{d.quran=e.target.value;save()};
  document.querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{d.c[el.dataset.c]=el.checked;save();prog()});
  document.querySelectorAll('[data-n]').forEach(el=>el.oninput=()=>{d[el.dataset.n]=el.value;save()});
  function prog(){const n=CHECKS.filter(c=>d.c[c]).length,p=Math.round(n/CHECKS.length*100);
    $('#pt').textContent='আজকের অগ্রগতি: '+bn(n)+' / '+bn(CHECKS.length)+' ('+bn(p)+'%)';
    $('#pb').style.width=p+'%';
    const s=streak();$('#st').textContent=s?'🔥 টানা '+bn(s)+' দিন ৫০%+ আমল':'ছোট ধারাবাহিক আমলই আল্লাহর কাছে প্রিয়।'}
  prog();
}

/* ---------- guide ---------- */
const GUIDE=[
['১. নিত্য পাঁচ ওয়াক্ত সালাত ও জামাত',`
<p class="mute">নিয়ম: আমলের ক্ষেত্রে ফরজ ও ওয়াজিব সবার আগে, এরপর সুন্নত ও নফল। রাকাতের সংখ্যা সাধারণ প্রচলিত (হানাফি) নিয়মে দেওয়া হয়েছে। যে আমল নিয়মিত করতে পারবেন তা-ই ধরুন; কম হলেও ধারাবাহিক আমলই আল্লাহর কাছে প্রিয় (সহিহ বুখারি ও মুসলিম)। কোনো মাসআলায় সন্দেহ থাকলে নির্ভরযোগ্য আলেমের কাছ থেকে জেনে নিন।</p>
<table><tr><th>ওয়াক্ত</th><th>সুন্নত (আগে)</th><th>ফরজ</th><th>সুন্নত/নফল (পরে)</th></tr>
<tr><td>ফজর</td><td>২ (মুয়াক্কাদা)</td><td>২</td><td>—</td></tr>
<tr><td>যোহর</td><td>৪ (মুয়াক্কাদা)</td><td>৪</td><td>২ সুন্নত + ২ নফল</td></tr>
<tr><td>আসর</td><td>৪ (গায়রে মুয়াক্কাদা)</td><td>৪</td><td>—</td></tr>

<h4>জামাত ও সালাতের আদব</h4><ul>
<li>আযানের পর যথাসম্ভব মসজিদে গিয়ে প্রথম কাতারে ও তাকবিরে উলার সাথে জামাতে শরিক হওয়ার চেষ্টা করুন। জামাতের সালাতে একাকী সালাতের চেয়ে ২৭ গুণ বেশি সওয়াব (সহিহ বুখারি ও মুসলিম)।</li>
<li>ওযু করে মসজিদে যাওয়া, আযানের জবাব দেওয়া এবং আযানের পর দরূদ ও আযানের দোয়া পড়া।</li>
<li>সালাত ধীরস্থিরভাবে, খুশু-খুযুর সাথে আদায় করা; রুকু-সিজদায় তাড়াহুড়া না করা।</li>
<li>প্রতি ওয়াক্তের সালাত প্রথম বা মুস্তাহাব সময়ে আদায়ের অভ্যাস করা।</li>
<li>ওযুর পর দুই রাকাত তাহিয়্যাতুল ওযু এবং মসজিদে প্রবেশ করে তাহিয়্যাতুল মসজিদ আদায়।</li>
<li>চাশতের (ইশরাক/দোহা) নফল সালাত: সূর্য ওঠার প্রায় ১৫–২০ মিনিট পর থেকে ২ থেকে ১২ রাকাত।</li>
<li>আওয়াবিনের নফল: মাগরিবের পর ৬ রাকাত পর্যন্ত (সামর্থ্য অনুযায়ী)।</li></ul>`],
['২. তাহাজ্জুদ, যিকির ও দোয়া',`
<h4>তাহাজ্জুদ</h4><ul>
<li>ইশার পর ঘুমিয়ে রাতের শেষ ভাগে (বিশেষত শেষ তৃতীয়াংশে) উঠে ২ থেকে ১২ রাকাত তাহাজ্জুদ। রাতের শেষ তৃতীয়াংশে আল্লাহ দুনিয়ার আসমানে নেমে এসে বান্দার দোয়া কবুলের ঘোষণা দেন (সহিহ বুখারি ও মুসলিম)।</li>
<li>উঠতে কষ্ট হলে অন্তত ২ রাকাত দিয়ে শুরু করুন এবং ধীরে ধীরে বাড়ান।</li>
<li>সিজদায় দীর্ঘ দোয়া, ইস্তিগফার ও নিজের প্রয়োজনের কথা আল্লাহকে বলা।</li></ul>
<h4>যিকির</h4><ul>
<li>সুবহানাল্লাহ, আলহামদুলিল্লাহ, আল্লাহু আকবার, লা ইলাহা ইল্লাল্লাহ: চলতে-ফিরতে, কাজের ফাঁকে জিহ্বা সিক্ত রাখা।</li>
<li>আস্তাগফিরুল্লাহ: দিনে কমপক্ষে ১০০ বার।</li>
<li>দরূদ শরিফ: দিনে অন্তত ১০০ বার বা সামর্থ্য অনুযায়ী।</li>
<li>লা হাওলা ওয়ালা কুওয়াতা ইল্লা বিল্লাহ: জান্নাতের ভান্ডারসমূহের একটি।</li></ul>
<h4>প্রতিদিনের মাসনুন দোয়া</h4><ul>
<li>ঘুম থেকে ওঠা, ঘুমাতে যাওয়া, খাবারের আগে ও পরে, বাথরুমে প্রবেশ ও বের হওয়া, ঘর থেকে বের হওয়া, যানবাহনে ওঠা, মসজিদে প্রবেশ ও বের হওয়ার দোয়া।</li>
<li>নিজের জন্য, পিতা-মাতা, পরিবার, উস্তাদ ও সমগ্র মুসলিম উম্মাহর জন্য দোয়া।</li>
<li>দোয়া কবুলের সময়: আযান ও ইকামতের মাঝে, সিজদায়, শেষ রাতে, জুমার দিনের নির্দিষ্ট মুহূর্তে।</li></ul>`],
['৩. কুরআন তিলাওয়াত ও অধ্যয়ন',`<ul>
<li><b>তিলাওয়াত:</b> প্রতিদিন কমপক্ষে ১ পারা বা অন্তত ১ রুকু। ফজরের পর বা অন্য কোনো নির্ধারিত সময় ঠিক করুন। প্রতিটি হরফে ১০ নেকি (জামে তিরমিযি)।</li>
<li><b>তাজবিদ:</b> সহিহ উচ্চারণ শেখা; প্রয়োজনে যোগ্য উস্তাদের কাছে নিয়মিত পাঠ নেওয়া।</li>
<li><b>অর্থ ও তাফসির:</b> প্রতিদিন কয়েকটি আয়াতের অনুবাদ ও সংক্ষিপ্ত তাফসির পড়া এবং বুঝে আমলের চেষ্টা।</li>
<li><b>হিফজ:</b> প্রতি সপ্তাহে ছোট একটি সূরা বা কয়েকটি আয়াত মুখস্থ করা; আগের মুখস্থ অংশ নিয়মিত রিভিশন দেওয়া।</li>
<li><b>খতম:</b> একটি বাস্তবসম্মত পরিকল্পনা। দৈনিক ১ পারা হলে মাসে ১ খতম। রমজানে লক্ষ্য বাড়ানো যায়।</li>
<li><b>আদব:</b> ওযু অবস্থায়, কিবলামুখী হয়ে, মনোযোগ দিয়ে এবং আগে আউযুবিল্লাহ-বিসমিল্লাহ পড়ে তিলাওয়াত শুরু করা।</li>
<li><b>নির্দিষ্ট সূরার অভ্যাস:</b> প্রতি রাতে ঘুমের আগে সূরা মুলক; জুমার দিনে সূরা কাহফ।</li></ul>`],
['৪. সকাল-সন্ধ্যার যিকির ও ফরজ-পরবর্তী আমল',`
<h4>সকাল-সন্ধ্যার যিকির (ফজরের পর ও আসর/মাগরিবের মধ্যে)</h4>

<li>ফজর ও মাগরিবের পর সূরা ইখলাস, ফালাক ও নাস ৩ বার করে।</li>

['৫. সাপ্তাহিক আমল',`

<h4>জুমার বিশেষ আমল</h4><ul>
<li>গোসল করা, পরিষ্কার ও সুন্দর পোশাক পরা, মিসওয়াক ও আতর (পুরুষদের জন্য) ব্যবহার করা।</li>
<li>আগে ভাগে মসজিদে যাওয়া এবং মনোযোগ দিয়ে খুতবা শোনা (খুতবার সময় কথা বলা থেকে বিরত থাকা)।</li>
<li>সূরা কাহফ তিলাওয়াত: দুই জুমার মধ্যবর্তী সময় নূরে আলোকিত থাকার সুসংবাদ আছে।</li>
<li>বেশি বেশি দরূদ পাঠ।</li>
<li>দোয়া কবুলের বিশেষ মুহূর্ত রয়েছে; আলেমদের মতে আসরের পর থেকে মাগরিবের আগে দোয়ায় মশগুল থাকা উত্তম।</li>
<li>সাদাকা করা এবং আত্মীয়-স্বজন ও প্রতিবেশীর খোঁজ নেওয়া।</li></ul>`],
['৬. মাসিক আমল (আইয়্যামে বীজ ও অন্যান্য)',`
<h4>আইয়্যামে বীজ: ১৩, ১৪ ও ১৫ তারিখের নফল রোজা</h4>
<p>প্রতি আরবি (হিজরি) মাসের ১৩, ১৪ ও ১৫ তারিখে নফল রোজা রাখা মুস্তাহাব। রাসুলুল্লাহ ﷺ প্রতি মাসে তিন দিন রোজা রাখার উৎসাহ দিয়েছেন, যা পুরো বছর রোজা রাখার সমতুল্য (সহিহ বুখারি ও মুসলিম)।</p>
<div class="note">লক্ষ রাখুন: তারিখগুলো হিজরি চান্দ্র মাস অনুযায়ী, ইংরেজি বা বাংলা মাসের তারিখ নয়। চাঁদ দেখা সাপেক্ষে স্থানীয় ক্যালেন্ডার দেখে নিন। রাতে নিয়ত করা, সাহরি খাওয়া এবং সময়মতো ইফতার করা সুন্নত।</div>
<h4>মাসের অন্যান্য আমল</h4><ul>
<li>প্রতি মাসে অন্তত একবার কুরআন খতমের লক্ষ্য রাখা।</li>
<li>মাসের শুরুতে নতুন লক্ষ্য ও পরিকল্পনা ঠিক করা, শেষে মূল্যায়ন করা।</li>
<li>নিয়মিত মাসিক সাদাকা: অল্প হলেও স্থায়ী দান (যেমন মাসে একটি নির্দিষ্ট অংশ)।</li>

function mon(k){return S.months[k]||(S.months[k]={m:{},g:{},b:[false,false,false],a:'',b2:'',p1:'',p2:'',p3:''})}
function autoCount(ym,spec){
  let n=0,tot=0;
  Object.keys(S.days).forEach(k=>{
    if(k.slice(0,7)!==ym)return;tot++;
    const d=S.days[k];
    if(spec==='J5'){if(d.jamaat===5)n++}else if(d.c[spec])n++;
  });
  return n;
}
function renderMonth(){

      html+=`<div class="chips">${[13,14,15].map((n,i)=>`<label><input type="checkbox" data-b="${i}"${M.b[i]?' checked':''}> ${bn(n)}</label>`).join('')}</div>`;
    }else{
      html+=`<input type="text" data-m="${k}" value="${esc(M.m[k])}">`;
    }

  });

   <div class="mute">এ মাসে আমার সবচেয়ে বড় অর্জন</div><textarea data-s="a">${esc(M.a)}</textarea>

   <input type="text" data-s="p2" placeholder="২)" value="${esc(M.p2)}" style="margin-bottom:6px">
   <input type="text" data-s="p3" placeholder="৩)" value="${esc(M.p3)}"></div>

  $('#app').innerHTML=html;
  $('#mp').onclick=()=>{mcur=new Date(mcur.getFullYear(),mcur.getMonth()-1,1);render()};
  $('#mn').onclick=()=>{mcur=new Date(mcur.getFullYear(),mcur.getMonth()+1,1);render()};
  document.querySelectorAll('[data-m]').forEach(el=>el.oninput=()=>{M.m[el.dataset.m]=el.value;save()});
  document.querySelectorAll('[data-g]').forEach(el=>el.oninput=()=>{M.g[el.dataset.g]=el.value;save()});
  document.querySelectorAll('[data-b]').forEach(el=>el.onchange=()=>{M.b[+el.dataset.b]=el.checked;save()});
  document.querySelectorAll('[data-s]').forEach(el=>el.oninput=()=>{M[el.dataset.s]=el.value;save()});
}

  <div class="card"><h3>হিজরি তারিখ সমন্বয়</h3>
   <p class="mute">১৩-১৪-১৫ তারিখের রোজা ও বিশেষ দিনের রিমাইন্ডার হিজরি ক্যালেন্ডার থেকে আনুমানিক হিসাব করা হয়। বাংলাদেশে চাঁদ দেখা সৌদির সাথে এক দিন এদিক-ওদিক হতে পারে। প্রয়োজনে এখানে মিলিয়ে নিন।</p>
   <select id="off"><option value="-1"${off===-1?' selected':''}>সৌদির চেয়ে ১ দিন পরে (সাধারণত বাংলাদেশ)</option><option value="0"${off===0?' selected':''}>সৌদি আরবের সাথে একই</option><option value="1"${off===1?' selected':''}>সৌদির চেয়ে ১ দিন আগে</option><option value="-2"${off===-2?' selected':''}>সৌদির চেয়ে ২ দিন পরে</option></select>
   <p class="mute" style="margin-top:8px">আজকের হিসাব: ${(()=>{const h=hijri(new Date());return h?bn(h.d)+' '+HM[h.m-1]+' '+bn(h.y):'পাওয়া যায়নি'})()}</p></div>
  <div class="card"><h3>ব্যাকআপ</h3>
   <p class="mute">আপনার সব তথ্য শুধু এই ফোনের ব্রাউজারে সংরক্ষিত থাকে। ফোন বদলালে বা ব্রাউজার ডেটা মুছলে হারিয়ে যেতে পারে। তাই মাঝেমধ্যে ব্যাকআপ নিয়ে রাখুন।</p>
   <button class="btn" id="exp">ব্যাকআপ ডাউনলোড</button>
   <button class="btn alt" id="imp">ব্যাকআপ থেকে ফিরিয়ে আনুন</button>
   <input type="file" id="file" accept="application/json" style="display:none"></div>
  <div class="card"><h3>সতর্কতা</h3><p class="mute">এটি একটি ব্যক্তিগত আমল-ট্র্যাকার। ফিকহি কোনো মাসআলায় সন্দেহ থাকলে নির্ভরযোগ্য আলেমের কাছ থেকে জেনে নিন।</p></div>`;
  if($('#inst'))$('#inst').onclick=async()=>{deferred.prompt();await deferred.userChoice;deferred=null;render()};
  $('#off').onchange=e=>{S.settings.offset=+e.target.value;save();render()};
  $('#exp').onclick=()=>{
    const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='amal-backup-'+dkey(new Date())+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
  $('#imp').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);
      if(!o||typeof o!=='object'||!o.days)throw 0;
      if(!confirm('বর্তমান সব তথ্য ব্যাকআপের তথ্য দিয়ে প্রতিস্থাপিত হবে। এগিয়ে যাবেন?'))return;
      S={days:o.days||{},months:o.months||{},settings:Object.assign({offset:-1},o.settings||{})};save();alert('ব্যাকআপ ফিরিয়ে আনা হয়েছে।');render()}
      catch(_){alert('ফাইলটি সঠিক ব্যাকআপ নয়।')}};
    r.readAsText(f)};
}

function render(){
  if(view==='today')renderToday();
  else if(view==='guide')renderGuide();
  else if(view==='month')renderMonth();
  else renderMore();
}
setView('today');

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
