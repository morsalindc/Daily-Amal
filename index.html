<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="আমলের গাইড">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>আমলের গাইড</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2b25;--mute:#66736d;--pri:#0f6b4f;--pri2:#e3f1ea;--line:#e4e0d4;--warn:#fff4d6;--warnink:#6b4e00}
@media (prefers-color-scheme:dark){:root{--bg:#10171a;--card:#18232a;--ink:#e8efe9;--mute:#98a8a0;--pri:#3fb68b;--pri2:#16352b;--line:#2a3a40;--warn:#3a3213;--warnink:#f1dd9a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Kalpurush","SolaimanLipi","Vrinda","Nirmala UI",system-ui,sans-serif;line-height:1.65;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;font-weight:700}
header small{opacity:.85;font-size:12px}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 2px 6px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:0}
nav button span{font-size:18px;line-height:1.2}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card h2,.card h3{margin:0 0 6px;font-size:16px}
.banner{background:var(--warn);color:var(--warnink);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{flex:1;cursor:pointer}
.sub-txt{display:block;font-size:12px;color:var(--mute)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);flex:none}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:56px;resize:vertical}
.sm{width:110px;flex:none;font-size:13px;padding:6px}
.read-btn{background:var(--pri2);color:var(--pri);border:0;border-radius:8px;padding:4px 8px;font-size:12px;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:3px;flex:none;cursor:pointer}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar button,.btn{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.btn.alt{background:var(--pri2);color:var(--pri)}
.datebar .mid{text-align:center;flex:1}
.datebar .mid b{display:block;font-size:16px}
.datebar .mid small{color:var(--mute)}
.bar{height:10px;background:var(--pri2);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}
.mute{color:var(--mute);font-size:13px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 14px}
summary{padding:12px 0;font-weight:700;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";float:right;color:var(--pri)}
details[open] summary::after{content:"－"}
details .in{padding-bottom:12px;font-size:15px}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
th,td{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
th{background:var(--pri2)}
.ar{font-size:22px;text-align:center;direction:rtl;margin:12px 0;color:var(--pri);font-weight:600}
.section-title{font-weight:700;margin:14px 0 6px;color:var(--pri);font-size:15px;border-bottom:2px solid var(--pri2);padding-bottom:4px}
.stat-box{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat-card{background:var(--pri2);border-radius:10px;padding:10px;text-align:center}
.stat-card b{display:block;font-size:18px;color:var(--pri)}
.stat-card small{display:block;font-size:11px}
.stat-card span{font-size:12px;color:var(--mute)}
.cal-grid{display:grid;grid-template-columns:repeat(7, 1fr);gap:4px;text-align:center;margin-top:8px;font-size:12px}
.cal-day{background:var(--bg);border-radius:6px;padding:6px 2px;color:var(--mute);cursor:pointer}
.cal-day.active{background:var(--pri);color:#fff;font-weight:700}
/* Modal & Slide styling */
#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#modal-box{background:var(--card);width:100%;max-width:540px;max-height:90vh;border-radius:16px;padding:16px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.2)}
.step-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.step-badge{background:var(--pri2);color:var(--pri);padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700}
/* Home Salat Grid */
.home-salat-grid{display:grid;grid-template-columns:repeat(5, 1fr);gap:6px;text-align:center;margin-top:10px}
.home-salat-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.home-salat-box.active{border:2px solid var(--pri);background:var(--pri2)}
</style>
</head>
<body>
<header><h1>আমলের গাইড</h1><small id="ver"></small></header>
<main id="app"></main>
<nav id="nav">
  <button data-v="home"><span>🏠</span>হোম</button>
  <button data-v="today"><span>✅</span>ট্র্যাকার</button>
  <button data-v="stats"><span>📊</span>স্টেট</button>
  <button data-v="learn"><span>📖</span>শিখুন</button>
  <button data-v="month"><span>📅</span>ছুটি ও মাস</button>
  <button data-v="more"><span>⚙️</span>আরও</button>
</nav>

<!-- Modal Container for Learn/Read Steps -->
<div id="modal" style="display:none">
  <div id="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px">
      <h3 id="modal-title" style="margin:0;color:var(--pri)">শিক্ষা ও রেফারেন্স</h3>
      <button class="btn alt" id="modal-close" style="padding:4px 10px;font-size:13px">✕ বন্ধ</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
const VERSION='1.8.0';
document.getElementById('ver').textContent='সংস্করণ '+VERSION;

const $=s=>document.querySelector(s);
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const GM=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const HM=['মুহাররম','সফর','রবিউল আউয়াল','রবিউস সানি','জমাদিউল আউয়াল','জমাদিউস সানি','রজব','শা\u2019বান','রমজান','শাওয়াল','জিলকদ','জিলহজ'];

const DEF={days:{},months:{},settings:{offset:-1}};
function load(){try{const o=JSON.parse(localStorage.getItem('amal.v1')||'{}');return {days:o.days||{},months:o.months||{},settings:Object.assign({offset:-1},o.settings||{})}}catch(e){return JSON.parse(JSON.stringify(DEF))}}
let S=load();
function save(){try{localStorage.setItem('amal.v1',JSON.stringify(S))}catch(e){}}

function day(k){
  if(!S.days[k]) S.days[k]={salats:{fajr:'',zuhr:'',asr:'',maghrib:'',isha:''},sunnah:{fajr_sunnah:false,zuhr_before:false,zuhr_after:false,maghrib_after:false,isha_after:false,witr:false},c:{},counts:{istighfar:0,durud:0},quran:'',n1:'',n2:'',n3:''};
  let d = S.days[k];
  if(!d.salats) d.salats={fajr:'',zuhr:'',asr:'',maghrib:'',isha:''};
  if(!d.sunnah) d.sunnah={fajr_sunnah:false,zuhr_before:false,zuhr_after:false,maghrib_after:false,isha_after:false,witr:false};
  if(!d.c) d.c={};
  if(!d.counts) d.counts={istighfar:0,durud:0};
  return d;
}

const SALAT_LIST=[['fajr', 'ফজর'],['zuhr', 'যোহর'],['asr', 'আসর'],['maghrib', 'মাগরিব'],['isha', 'ইশা']];
const SALAT_STATUSES=[
  ['', '-- স্ট্যাটাস নেই --'],
  ['jamaat', 'জামাতে আদায়'],
  ['alone_on_time', 'একা (সময়মতো)'],
  ['alone_late', 'একা (দেরিতে)'],
  ['qada', 'কাজা আদায়'],
  ['miss', 'মিস / ছুটেছে']
];
const SUNNAH_LIST=[
  ['fajr_sunnah', 'ফজরের ২ রাকাত সুন্নত'],
  ['zuhr_before', 'যোহরের আগের ৪ রাকাত সুন্নত'],
  ['zuhr_after', 'যোহরের পরের ২ রাকাত সুন্নত'],
  ['maghrib_after', 'মাগরিবের পরের ২ রাকাত সুন্নত'],
  ['isha_after', 'ইশার পরের ২ রাকাত সুন্নত'],
  ['witr', 'বিতর ওয়াজিব সালাত']
];

/* ধাপে ধাপে শেখার রেফারেন্স ডেটাসেট (শিখুন ট্যাবের জন্য) */
const LEARN_DETAILS = {

      { num: '২', title: 'সকাল ও সন্ধ্যার তাসবিহ', desc: 'নিয়মিত সকাল ও সন্ধ্যায় পাঠ করার মাসনুন আমল।', ar: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', pron: 'Subhanallahi wa bi-hamdihi', trans: 'আল্লাহ পবিত্র এবং সমস্ত প্রশংসা তাঁরই জন্য।' }

    ]
  },
  post_salat_dhikr: {
    title: 'পাঁচ ওয়াক্ত নামাজের পরের আমল',
    steps: [
      { num: '১', title: 'তাসবীহাতে ফাতেমী', desc: 'ফরজ সালাতের পর নিয়মিত আমল।', ar: 'سُبْحَانَ اللَّهِ (৩৩ বার), الْحَمْدُ لِلَّهِ (৩৩ বার), اللَّهُ أَكْبَرُ (৩৪ বার)', pron: 'Subhanallah, Alhamdulillah, Allahu Akbar', trans: 'আল্লাহ পবিত্র, সমস্ত প্রশংসা আল্লাহর, আল্লাহ সবচেয়ে বড়।' }
    ]
  },

const CATEGORIES = [
  {
    title: '🕌 নফল নামাজ',
    items: [

      ['istighfar', 'ইস্তেগফার (কমপক্ষে ১০০ বার)', 'টাইপ করে ইনপুট দিন নিচে', 'NUM', 'istighfar', 100],
      ['durud', 'দরুদ শরিফ (কমপক্ষে ১০০ বার)', 'টাইপ করে ইনপুট দিন নিচে', 'NUM', 'durud', 100],
      ['asmul_husna', 'আসমাউল হুসনা', 'আল্লাহর ৯৯টি সুন্দর নাম']

function hijri(date){
  try{
    const d=new Date(date.getTime()+S.settings.offset*864e5);
    const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(d);
    const g=t=>parseInt(p.find(x=>x.type===t).value,10);
    const r={d:g('day'),m:g('month'),y:g('year')};
    return (r.d&&r.m)?r:null;
  }catch(e){return null}
}

function getTotalChecklistCount(){ 
  let count = SALAT_LIST.length + SUNNAH_LIST.length;
  CATEGORIES.forEach(cat => { cat.items.forEach(() => count++); });
  return count;
}

function getCompletedCount(d){
  let count = 0;
  SALAT_LIST.forEach(([id])=>{ if(d.salats[id] && d.salats[id] !== 'miss') count++; });
  SUNNAH_LIST.forEach(([id])=>{ if(d.sunnah[id]) count++; });
  CATEGORIES.forEach(cat => {
    cat.items.forEach(([id, , , type, numKey, targetNum]) => {
      if(type === 'NUM' && numKey) {
        if((d.counts && d.counts[numKey] >= targetNum) || d.c[id]) count++;
      } else {
        if(d.c[id]) count++;
      }
    });
  });
  return count;
}

function pct(k){ const d=S.days[k]; if(!d)return 0; return getCompletedCount(d)/getTotalChecklistCount(); }
function streak(){
  let n=0,d=new Date();
  if(pct(dkey(d))<0.4) d.setDate(d.getDate()-1);
  while(pct(dkey(d))>=0.4){n++;d.setDate(d.getDate()-1);if(n>3650)break}
  return n;
}

/* ---------- Stats / State View ---------- */
function renderStats(){
  const ym=mkey(mcur);
  let today = new Date();
  let currentYear = String(today.getFullYear());
  let firstDayOfWeek = new Date(today);
  firstDayOfWeek.setDate(today.getDate() - today.getDay());

  let daysKeys = Object.keys(S.days).filter(k=>{
    if(statFilter==='month') return k.slice(0,7)===ym;
    if(statFilter==='year') return k.slice(0,4)===currentYear;
    if(statFilter==='week') {
      let dParts = k.split('-').map(Number);
      let dObj = new Date(dParts[0], dParts[1]-1, dParts[2]);
      return dObj >= firstDayOfWeek && dObj <= today;
    }
    if(statFilter==='custom' && customStart && customEnd) {
      return k >= customStart && k <= customEnd;
    }
    if(statFilter==='all') return true;
    return true;
  });

  let totalDays = daysKeys.length;

  let salatStats = {
    jamaat: {fajr:0, zuhr:0, asr:0, maghrib:0, isha:0},
    alone_on_time: {fajr:0, zuhr:0, asr:0, maghrib:0, isha:0},
    alone_late: {fajr:0, zuhr:0, asr:0, maghrib:0, isha:0},
    qada: {fajr:0, zuhr:0, asr:0, maghrib:0, isha:0},
    miss: {fajr:0, zuhr:0, asr:0, maghrib:0, isha:0}
  };
  let totalSalatActions = { jamaat: 0, alone_on_time: 0, alone_late: 0, qada: 0, miss: 0 };

  let sunnahStats = {};
  SUNNAH_LIST.forEach(([id])=> sunnahStats[id]=0);

  let categoryStats = {};
  CATEGORIES.forEach(cat => { cat.items.forEach(([id]) => categoryStats[id]=0); });

  daysKeys.forEach(k=>{
    const d=S.days[k];
    if(d){
      if(d.salats){
        SALAT_LIST.forEach(([id])=>{
          let st=d.salats[id];
          if(st && salatStats[st]){
            salatStats[st][id]++;
            totalSalatActions[st]++;
          }
        });
      }
      if(d.sunnah){
        SUNNAH_LIST.forEach(([id])=>{ if(d.sunnah[id]) sunnahStats[id]++; });
      }
      CATEGORIES.forEach(cat => {
        cat.items.forEach(([id, , , type, numKey, targetNum]) => {
          if(type === 'NUM' && numKey) {
            if((d.counts && d.counts[numKey] >= targetNum) || (d.c && d.c[id])) categoryStats[id]++;
          } else {
            if(d.c && d.c[id]) categoryStats[id]++;
          }
        });
      });
    }
  });

  const calcPct = (val) => {
    if(totalDays === 0) return '০%';
    return bn(Math.round((val / totalDays) * 100)) + '%';
  };

  const calcTotalSalatPct = (val) => {
    let maxPossible = totalDays * 5;
    if(maxPossible === 0) return '০%';
    return bn(Math.round((val / maxPossible) * 100)) + '%';
  };

  let yearNum = mcur.getFullYear();
  let monthNum = mcur.getMonth();
  let firstDayIndex = new Date(yearNum, monthNum, 1).getDay();
  let totalDaysInMonth = new Date(yearNum, monthNum + 1, 0).getDate();

  let calHtml = `<div class="datebar" style="margin-bottom:8px">
    <button id="cal-prev" class="btn alt" style="padding:4px 10px">‹ মাস</button>
    <b>${GM[monthNum]} ${bn(yearNum)}</b>
    <button id="cal-next" class="btn alt" style="padding:4px 10px">মাস ›</button>
  </div>
  <div class="cal-grid">
    <div class="mute">রবি</div><div class="mute">সোম</div><div class="mute">মঙ্গল</div><div class="mute">বুধ</div><div class="mute">বৃহ</div><div class="mute">শুক্র</div><div class="mute">শনি</div>`;
  for(let i=0; i<firstDayIndex; i++) { calHtml+=`<div></div>`; }
  for(let d=1; d<=totalDaysInMonth; d++) {
    let dayStr = yearNum + '-' + pad(monthNum+1) + '-' + pad(d);
    let hasRecord = S.days[dayStr] && getCompletedCount(S.days[dayStr]) > 0;
    calHtml+=`<div class="cal-day${hasRecord?' active':''}" data-date="${dayStr}">${bn(d)}</div>`;
  }
  calHtml+=`</div>`;

  let html=`<div class="card">

    ${statFilter==='custom'?`

  </div>`;

  html+=`<div class="card"><h3>📅 ক্যালেন্ডার (তারিখে ক্লিক করে আমল দেখুন)</h3>${calHtml}</div>`;

      cur = new Date(parts[0], parts[1]-1, parts[2]);
      setView('today');
    };
  });
}

/* ---------- Tracker View (সাবেক আজ ট্যাব) ---------- */
function renderToday(){
  const k=dkey(cur),d=day(k),h=hijri(cur);
  const isToday=k===dkey(new Date());
  
  let html=`<div class="card"><div class="datebar">
   <button id="prev">‹</button>
   <div class="mid"><b>${bn(cur.getDate())} ${GM[cur.getMonth()]} ${bn(cur.getFullYear())}, ${WD[cur.getDay()]}</b>
   <small>${h?bn(h.d)+' '+HM[h.m-1]+' '+bn(h.y)+' হি. (আনুমানিক)':''}</small></div>
   <button id="next">›</button></div>
   ${isToday?'':'<div style="text-align:center;margin-top:8px"><button class="btn alt" id="tod">আজকে ফিরুন</button></div>'}</div>`;
  
  specials(cur).forEach(t=>html+=`<div class="banner">${esc(t)}</div>`);
  
  html+=`<div class="card" style="background:var(--pri2);border-color:var(--pri)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>🕌 নামাজের সময় ও নিষিদ্ধ সময়</b>
      <button class="read-btn" id="pray-link">🌐 অনলাইন দেখুন</button>
    </div>
    <small class="mute">করাচি বিশ্ববিদ্যালয় ও হানাফি মাজহাবের সময়সূচি।</small>
  </div>`;

  html+=`<div class="card"><div class="mute" id="pt"></div><div class="bar"><i id="pb"></i></div><div class="mute" id="st"></div>`;
  
  html+=`<div class="section-title">🕌 পাঁচ ওয়াক্ত ফরজ সালাত</div>`;
  SALAT_LIST.forEach(([id, label])=>{
    html+=`<div class="row"><label>${label} সালাত</label><select class="sm salat-sel" data-salat="${id}">`;
    SALAT_STATUSES.forEach(([val, txt])=>{
      let sel = (d.salats[id] === val) ? ' selected' : '';
      html+=`<option value="${val}"${sel}>${txt}</option>`;
    });
    html+=`</select></div>`;
  });

  html+=`<div class="section-title">☀️ সুন্নতে মুয়াক্কাদা ও ওয়াজিব</div>`;
  SUNNAH_LIST.forEach(([id, label])=>{
    let checked = d.sunnah[id] ? ' checked' : '';
    html+=`<div class="row"><input type="checkbox" id="sun_${id}" data-sun="${id}"${checked}><label for="sun_${id}">${label}</label></div>`;
  });

  CATEGORIES.forEach(cat => {
    html+=`<div class="section-title">${cat.title}</div>`;
    cat.items.forEach(([id, label, desc, type, numKey, targetNum]) => {
      let hasRead = LEARN_DETAILS[id] !== undefined;
      if(type === 'NUM' && numKey) {
        let val = d.counts && d.counts[numKey] !== undefined ? d.counts[numKey] : 0;
        let isComplete = val >= targetNum;
        html+=`<div class="row" style="flex-direction:column;align-items:stretch">
          <div style="display:flex;align-items:center;gap:10px">
            <input type="checkbox" ${isComplete?'checked':''} disabled style="cursor:default">
            <label style="flex:1">${label}<span class="sub-txt">${desc} (পঠিত: ${bn(val)} বার)</span></label>
            ${hasRead?`<button class="read-btn" data-read="${id}">📖 পড়ুন</button>`:''}
          </div>
          <div style="display:flex;gap:8px;margin-top:6px;align-items:center">
            <input type="number" class="num-input sm" data-num="${numKey}" value="${val}" placeholder="সংখ্যা লিখুন" style="width:100px">
            <span class="mute">${isComplete?'✅ লক্ষ্য পূরণ (১০০%)':`লক্ষ্য: ${bn(targetNum)} বার`}</span>
          </div>
        </div>`;
      } else {
        let checked = d.c[id] ? ' checked' : '';
        html+=`<div class="row">
          <input type="checkbox" id="${id}" data-c="${id}"${checked}>
          <label for="${id}">${label}<span class="sub-txt">${desc}</span></label>
          ${hasRead?`<button class="read-btn" data-read="${id}">📖 পড়ুন</button>`:''}
        </div>`;
        if(id==='quran_recite') {
          html+=`<div class="row" style="padding-top:0"><input type="text" id="qa" placeholder="পরিমাণ (যেমন: ২ পৃষ্ঠা / ১ রুকু / ১ পারা)" value="${esc(d.quran)}"></div>`;
        }
      }
    });
  });

  html+=`</div><div class="card"><h3>আজকের ভাবনা</h3>
   <div class="mute">আজ যে ভালো কাজ করতে পেরেছি</div><textarea data-n="n1">${esc(d.n1)}</textarea>
   <div class="mute" style="margin-top:8px">যে ভুল বা অবহেলা হয়েছে</div><textarea data-n="n2">${esc(d.n2)}</textarea>
   <div class="mute" style="margin-top:8px">আগামীকাল যে বিষয়ে উন্নতি করব</div><textarea data-n="n3">${esc(d.n3)}</textarea></div>`;
  
  $('#app').innerHTML=html;
  
  const shift=n=>{cur.setDate(cur.getDate()+n);render()};
  $('#prev').onclick=()=>shift(-1);
  $('#next').onclick=()=>shift(1);
  if($('#tod'))$('#tod').onclick=()=>{cur=new Date();render()};

  $('#pray-link').onclick = () => {
    showLearnModal('am_dhikr');
  };

  document.querySelectorAll('.read-btn[data-read]').forEach(btn => {
    btn.onclick = () => {
      showLearnModal(btn.dataset.read);
    };
  });
  
  document.querySelectorAll('.salat-sel').forEach(el=>{
    el.onchange=e=>{ d.salats[el.dataset.salat]=e.target.value; save(); prog(); }
  });

  document.querySelectorAll('[data-sun]').forEach(el=>{
    el.onchange=()=>{ d.sunnah[el.dataset.sun]=el.checked; save(); prog(); }
  });

  document.querySelectorAll('.num-input').forEach(el=>{
    el.oninput=e=>{
      let kName = el.dataset.num;
      let val = parseInt(e.target.value) || 0;
      if(!d.counts) d.counts={};
      d.counts[kName] = val;
      if(val >= 100) d.c[kName] = true;
      else d.c[kName] = false;
      save();
      prog();
    }
  });

  if($('#qa')) $('#qa').oninput=e=>{d.quran=e.target.value;save()};
  
  document.querySelectorAll('[data-c]').forEach(el=>{
    el.onchange=()=>{ d.c[el.dataset.c]=el.checked; save(); prog(); }
  });

  document.querySelectorAll('[data-n]').forEach(el=>{
    el.oninput=()=>{ d[el.dataset.n]=el.value; save(); }
  });

  function prog(){
    const total = getTotalChecklistCount();
    const done = getCompletedCount(d);
    const p = Math.round((done/total)*100);
    $('#pt').textContent='আজকের অগ্রগতি: '+bn(done)+' / '+bn(total)+' ('+bn(p)+'%)';
    $('#pb').style.width=p+'%';
    const s=streak();
    $('#st').textContent=s?'🔥 টানা '+bn(s)+' দিন ধারাবাহিক আমল':'ছোট ধারাবাহিক আমলই আল্লাহর কাছে প্রিয়।';
  }
  prog();
}

function mon(k){return S.months[k]||(S.months[k]={m:{},g:{},b:[false,false,false],a:'',b2:'',p1:'',p2:'',p3:''})}
function autoCount(ym,spec){
  let n=0;
  Object.keys(S.days).forEach(k=>{
    if(k.slice(0,7)!==ym)return;
    const d=S.days[k];
    if(spec==='M_SALAT'){
      let allJamaat = true;
      SALAT_LIST.forEach(([id])=>{ if(d.salats[id] !== 'jamaat') allJamaat=false; });
      if(allJamaat) n++;
    } else if(spec.startsWith('A:')){
      if(d.c[spec.slice(2)]) n++;
    }
  });
  return n;
}

/* ---------- More / Settings View ---------- */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(view==='more')renderMore()});
function renderMore(){
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const off=S.settings.offset;
  $('#app').innerHTML=`
  <div class="card"><h3>অ্যাপ ইনস্টল</h3>
   ${standalone?'<p>অ্যাপটি ইতোমধ্যে ইনস্টল করা আছে।</p>':
     deferred?'<button class="btn" id="inst">অ্যাপ ইনস্টল করুন</button>':
     isIOS?'<p>iPhone/iPad: Safari-তে নিচের Share বাটন চেপে "Add to Home Screen" দিন।</p>':
     '<p>Chrome মেনু (⋮) থেকে "Install app" বা "Add to Home screen" দিন।</p>'}</div>
  <div class="card"><h3>হিজরি তারিখ সমন্বয়</h3>
   <select id="off">
     <option value="-1"${off===-1?' selected':''}>সৌদির চেয়ে ১ দিন পরে (সাধারণত বাংলাদেশ)</option>
     <option value="0"${off===0?' selected':''}>সৌদি আরবের সাথে একই</option>
     <option value="1"${off===1?' selected':''}>সৌদির চেয়ে ১ দিন আগে</option>
     <option value="-2"${off===-2?' selected':''}>সৌদির চেয়ে ২ দিন পরে</option>
   </select></div>
  <div class="card"><h3>ব্যাকআপ</h3>
   <button class="btn" id="exp">ব্যাকআপ ডাউনলোড</button>
   <button class="btn alt" id="imp">ব্যাকআপ থেকে ফিরিয়ে আনুন</button>
   <input type="file" id="file" accept="application/json" style="display:none"></div>`;
  if($('#inst'))$('#inst').onclick=async()=>{deferred.prompt();await deferred.userChoice;deferred=null;renderMore()};
  $('#off').onchange=e=>{S.settings.offset=+e.target.value;save();renderMore()};
  $('#exp').onclick=()=>{
    const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='amal-backup-'+dkey(new Date())+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
  $('#imp').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);
      if(!o||typeof o!=='object'||!o.days)throw 0;
      if(!confirm('বর্তমান সব তথ্য ব্যাকআপের তথ্য দিয়ে প্রতিস্থাপিত হবে। এগিয়ে যাবেন?'))return;
      S={days:o.days||{},months:o.months||{},settings:Object.assign({offset:-1},o.settings||{})};save();alert('ব্যাকআপ ফিরিয়ে আনা হয়েছে।');render()}
      catch(_){alert('ফাইলটি সঠিক ব্যাকআপ নয়।')}};
    r.readAsText(f)};
}

function render(){
  if(view==='home')renderHome();
  else if(view==='today')renderToday();
  else if(view==='stats')renderStats();
  else if(view==='learn')renderLearn();
  else if(view==='month')renderMonth();
  else renderMore();
}
setView('home');

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}))
}
</script>
